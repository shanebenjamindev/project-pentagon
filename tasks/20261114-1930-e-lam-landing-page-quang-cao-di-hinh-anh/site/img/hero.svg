 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b98aff"/><stop offset="1" stop-color="#8a4fd1"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f9bff"/><stop offset="1" stop-color="#3b6fd8"/></linearGradient>
