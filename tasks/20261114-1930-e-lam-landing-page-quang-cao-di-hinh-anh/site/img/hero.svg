 </defs><style>
@media (prefers-reduced-motion: no-preference){
 .flow{animation:dash 1.4s linear infinite}
 .flow-r{animation:dashr 1.4s linear infinite}
 .dot{animation:run 3.2s ease-in-out infinite}
 .halo{transform-origin:403px 300px;animation:pulse 3.6s ease-in-out infinite}
 .ring{transform-origin:403px 300px;animation:ring 3.6s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-32}}
 @keyframes dashr{to{stroke-dashoffset:32}}
 @keyframes run{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
 @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
 @keyframes ring{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
}
