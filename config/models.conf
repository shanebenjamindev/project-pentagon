# Chọn model theo CỠ VIỆC: việc nhỏ dùng model nhỏ (nhanh, đỡ tốn hạn mức), việc lớn dùng model mạnh.
# Mỗi dòng:  vai trò hoặc công cụ | nhỏ | vừa | lớn | siêu khó
#
# - quan-ly: AI quản lý khi chạy từ web app / bin/manager (cỡ do AI tự phân loại hoặc chủ chọn).
# - claude, codex, gemini: worker, khi quản lý gọi  bin/ask <worker> -s nho|vua|lon|sieu ...
# - siêu khó: chỉ dùng khi chủ chọn (model mạnh nhất, tốn hạn mức nhất); AI tự phân loại chỉ chọn nhỏ / vừa / lớn.
# - Giá trị: tên model, có thể thêm @mức_suy_nghĩ (low | medium | high | xhigh | max).
#   "-" = không đổi: dùng model trong workers.conf (hoặc mặc định của CLI).
# - Codex với tài khoản ChatGPT hiện chỉ chạy được gpt-6-luna, nên phân cỡ bằng mức suy nghĩ.
#   Xem model Codex hỗ trợ: codex debug models
#
# vai trò | nhỏ              | vừa               | lớn             | siêu khó
quan-ly   | haiku            | sonnet            | opus            | claude-fable-5-2
claude    | haiku            | sonnet            | opus            | fable
codex     | gpt-6-luna@low   | gpt-6-luna@medium | gpt-6-luna@high | gpt-6-luna@xhigh
gemini    | gemini-2.5-flash | gemini-2.5-pro    | gemini-2.5-pro  | gemini-2.5-pro
