# Danh sách AI worker. Mỗi dòng: tên | công cụ | thư mục tài khoản | thế mạnh | model (tuỳ chọn)
#
# - công cụ: claude | codex | gemini
# - thư mục tài khoản: "default" = tài khoản đang đăng nhập sẵn của CLI đó trên máy.
#   Tài khoản thêm vào thì đặt thư mục riêng, rồi chạy:  bin/login <tên>
# - model: để trống = model mặc định của CLI. Xem model Codex hỗ trợ: codex debug models
# - Thứ tự dòng = thứ tự ưu tiên khi gọi theo tên công cụ (bin/ask claude ...).
#
# Thêm tài khoản: bỏ dấu # ở các dòng mẫu cuối file (hoặc tự thêm dòng), rồi bin/login <tên>.

claude-main  | claude | default | Tài khoản Claude chính (Team) |
codex-main   | codex  | default | Tài khoản ChatGPT chính       | gpt-6-luna

# Gemini đang TẮT: tài khoản Google hiện tại là gói miễn phí, Google đã ngừng cho Gemini CLI
# dùng gói này (lỗi UNSUPPORTED_CLIENT). Bật lại khi có tài khoản Google AI Pro/Ultra hoặc
# Google Workspace hợp lệ: bỏ dấu # dòng dưới rồi chạy bin/login gemini-main.
# gemini-main | gemini | default | Tài khoản Google chính      |

claude-2     | claude | ~/.pentagon/accounts/claude-2 | Tài khoản Claude thứ 2 |
# claude-3   | claude | ~/.pentagon/accounts/claude-3 | Tài khoản Claude thứ 3  |
# codex-2    | codex  | ~/.pentagon/accounts/codex-2  | Tài khoản ChatGPT thứ 2 | gpt-6-luna
# gemini-2   | gemini | ~/.pentagon/accounts/gemini-2 | Tài khoản Google thứ 2  |
