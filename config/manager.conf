# Cấu hình AI quản lý khi chạy nền từ web app (bin/dashboard) hoặc bin/manager.
# Khi chạy nền, quản lý chỉ được dùng các lệnh trong danh sách mặc định (bin/ask, bin/progress, bin/new-task,
# bin/workers, bin/status, ls, cat, head, tail, wc, mkdir, date) và đọc/ghi file trong dự án.
#
# model: để trống = model mặc định của Claude Code. Ví dụ: model=opus
model=
# allow: thêm quyền, cách nhau bằng dấu cách, cú pháp như --allowedTools của Claude Code.
# Ví dụ cho phép chạy test python:  allow=Bash(python3:*) Bash(pytest:*)
allow=
