<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Đăng nhập · Pentagon</title>
<script>(function(){var m="auto";try{m=localStorage.getItem("pentagon.mode")||"auto"}catch(e){}
  var d=m==="dark"||(m==="auto"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.dark=d?"1":"0";document.documentElement.style.colorScheme=d?"dark":"light"})();</script>
<link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--text:#1d2228;--muted:#69727d;--soft:#f0f2f5;
  --accent:#3b6fd8;--ok:#1f9d55;--warn:#c58a00;--bad:#d64545;--run:#0e8fa6;--mgr:#8a4fd1;--me:#e8f0ff;
}
:root[data-dark="1"]{
  --bg:#121417;--panel:#1a1d21;--line:#2b3036;--text:#e6e8eb;--muted:#9099a3;--soft:#22262b;
  --accent:#6f9bff;--ok:#3ccf7f;--warn:#f0b429;--bad:#ff6b6b;--run:#3cc7de;--mgr:#b98aff;--me:#23324f;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:min(380px,100%);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.12)}
.logo{display:block;width:min(230px,75%);height:auto;margin:0 auto 20px}
h1{text-align:center;font-size:18px;margin:0 0 20px}
label{display:block;font-weight:600;margin-bottom:6px}
input{display:block;width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.error{min-height:22px;margin:5px 0 10px;color:var(--bad);font-size:13px}
.btn{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:7px;padding:9px 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/static/logo.png" alt="Pentagon">
  <h1>Đăng nhập dashboard</h1>
  <form id="loginForm">
    <input type="text" name="username" autocomplete="username" value="pentagon" hidden>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <div class="error" id="error" role="alert" aria-live="polite"></div>
    <button class="btn pri" id="submit" type="submit">Đăng nhập</button>
  </form>
</main>
<script>
const form=document.querySelector("#loginForm"),password=document.querySelector("#password"),error=document.querySelector("#error"),button=document.querySelector("#submit");
let retryTimer=0;
function unlockAt(deadline){clearInterval(retryTimer);const update=()=>{const left=Math.max(0,Math.ceil(deadline-Date.now()/1000));if(left){button.disabled=true;error.textContent=`Đăng nhập bị khoá. Thử lại sau ${left} giây.`}else{clearInterval(retryTimer);retryTimer=0;button.disabled=false}};update();if(retryTimer!==0||Date.now()/1000<deadline)retryTimer=setInterval(update,250)}
form.addEventListener("submit",async event=>{
  event.preventDefault();if(button.disabled)return;
  button.disabled=true;error.textContent="";
  try{
    const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json","X-Pentagon":"1"},body:JSON.stringify({password:password.value})});
    const data=await response.json().catch(()=>({}));
    if(response.ok){location.href="/";return}
    if(response.status===429)unlockAt(Date.now()/1000+(Number(data.retry_after)||60));
    else error.textContent=data.error||"Đăng nhập thất bại";
  }catch(e){error.textContent="Không kết nối được tới dashboard."}
  finally{if(!retryTimer)button.disabled=false}
});
</script>
</body>
</html>
